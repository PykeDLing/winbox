<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- WinBox icon: a Windows app window standing in a brushed-metal tray, the Windows sibling of MacBox's icon. Drawn on a 256 grid for 96 px and up; the smaller sizes have drawings of their own. scripts/make-icon.ps1 renders AppIcon.ico from these files. -->
  <defs>
    <!-- Tray. Light comes from above: the front wall is bright under its lip and darkens toward the floor. -->
    <linearGradient id="face" x1="0" y1="120" x2="0" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1F3F6"/>
      <stop offset="0.35" stop-color="#DCE0E5"/>
      <stop offset="0.8" stop-color="#BCC2CA"/>
      <stop offset="1" stop-color="#A2A9B2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="118" cy="150" r="1" gradientTransform="translate(118 150) scale(118 36) translate(-118 -150)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- The rounded ends of the tray turn away from the light -->
    <linearGradient id="ends" x1="20" y1="0" x2="236" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A414A" stop-opacity="0.42"/>
      <stop offset="0.08" stop-color="#3A414A" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#3A414A" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#3A414A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3A414A" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="floorLight" x1="0" y1="200" x2="0" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="94" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C3C9D0"/>
    </linearGradient>
    <linearGradient id="backWall" x1="0" y1="100" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F8792"/>
      <stop offset="0.12" stop-color="#9AA1AB"/>
      <stop offset="0.5" stop-color="#B0B6BE"/>
      <stop offset="1" stop-color="#8C939D"/>
    </linearGradient>
    <linearGradient id="sideWall" x1="0" y1="100" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E7681"/>
      <stop offset="1" stop-color="#8F96A0"/>
    </linearGradient>
    <!-- Window -->
    <linearGradient id="titlebar" x1="0" y1="40" x2="0" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3393E3"/>
      <stop offset="1" stop-color="#0F6CBD"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="68" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBEEF2"/>
    </linearGradient>
    <linearGradient id="occlusion" x1="0" y1="132" x2="0" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2933" stop-opacity="0"/>
      <stop offset="1" stop-color="#1F2933" stop-opacity="0.24"/>
    </linearGradient>

    <path id="outline" d="M44 94 H212 C226 94 236 103 236 116 V198 A26 26 0 0 1 210 224 H46 A26 26 0 0 1 20 198 V116 C20 103 30 94 44 94 Z"/>
    <path id="front" d="M30 120 H52 C66 120 72 156 90 156 H166 C184 156 190 120 204 120 H226 A10 10 0 0 1 236 130 V198 A26 26 0 0 1 210 224 H46 A26 26 0 0 1 20 198 V130 A10 10 0 0 1 30 120 Z"/>
    <path id="lip" d="M20 130 A10 10 0 0 1 30 120 H52 C66 120 72 156 90 156 H166 C184 156 190 120 204 120 H226 A10 10 0 0 1 236 130"/>
    <clipPath id="frontClip"><use href="#front"/></clipPath>
    <clipPath id="windowClip"><rect x="62" y="40" width="132" height="140" rx="10"/></clipPath>

    <filter id="brushed" filterUnits="userSpaceOnUse" x="18" y="92" width="220" height="134">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.7" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1"/>
    </filter>
    <filter id="windowShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0B2540" flood-opacity="0.34"/>
    </filter>
    <filter id="ground" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <!-- Contact shadow -->
  <ellipse cx="128" cy="223" rx="102" ry="6" fill="#0E1620" opacity="0.3" filter="url(#ground)"/>

  <!-- Tray behind the window: the rim, then the inside walls -->
  <use href="#outline" fill="url(#rim)"/>
  <path d="M28 170 V116 C28 106 36 100 48 100 H208 C220 100 228 106 228 116 V170 Z" fill="url(#backWall)"/>
  <path d="M28 170 V116 C28 106 36 100 48 100 H54 C46 104 40 112 38 124 V170 Z" fill="url(#sideWall)"/>
  <path d="M228 170 V116 C228 106 220 100 208 100 H202 C210 104 216 112 218 124 V170 Z" fill="url(#sideWall)"/>
  <path d="M48 100.6 H208" stroke="#59616B" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- The window, standing in the tray -->
  <rect x="62" y="40" width="132" height="140" rx="10" fill="url(#page)" filter="url(#windowShadow)"/>
  <g clip-path="url(#windowClip)">
    <rect x="62" y="40" width="132" height="28" fill="url(#titlebar)"/>
    <rect x="62" y="40" width="132" height="1.5" fill="#FFFFFF" opacity="0.28"/>
    <rect x="62" y="67.5" width="132" height="1" fill="#0A4F8C" opacity="0.3"/>
    <!-- caption buttons: minimize, maximize, close -->
    <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
      <path d="M136 54.5 H144"/>
      <rect x="156" y="50.5" width="8" height="8" rx="1.5" stroke-width="2"/>
      <path d="M176 50.5 L184 58.5 M184 50.5 L176 58.5"/>
    </g>
    <!-- content -->
    <g fill="#D3D8DF">
      <rect x="76" y="82" width="100" height="8" rx="4"/>
      <rect x="76" y="99" width="82" height="8" rx="4"/>
      <rect x="76" y="116" width="66" height="8" rx="4"/>
      <rect x="76" y="133" width="92" height="8" rx="4"/>
    </g>
    <rect x="62" y="40" width="132" height="140" fill="url(#occlusion)"/>
  </g>
  <rect x="62.5" y="40.5" width="131" height="139" rx="9.5" fill="none" stroke="#0B2540" stroke-opacity="0.18"/>

  <!-- Front wall -->
  <use href="#front" fill="url(#face)"/>
  <g clip-path="url(#frontClip)">
    <rect x="18" y="92" width="220" height="134" filter="url(#brushed)" opacity="0.13" style="mix-blend-mode:soft-light"/>
    <ellipse cx="118" cy="150" rx="118" ry="36" fill="url(#sheen)"/>
    <rect x="18" y="92" width="220" height="134" fill="url(#ends)"/>
    <rect x="18" y="196" width="220" height="30" fill="url(#floorLight)"/>
    <!-- the lip: a rolled edge, bright on top with a crease beneath -->
    <use href="#lip" fill="none" stroke="#F6F8FA" stroke-width="12"/>
    <use href="#lip" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <use href="#lip" fill="none" stroke="#8B929C" stroke-opacity="0.55" stroke-width="1.2" transform="translate(0 6.5)"/>
    <use href="#lip" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1" transform="translate(0 7.8)"/>
  </g>

  <!-- Definition against light backgrounds -->
  <use href="#outline" fill="none" stroke="#353C44" stroke-opacity="0.5" stroke-width="1"/>
</svg>
