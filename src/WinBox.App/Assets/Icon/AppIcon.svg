<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- WinBox icon: a Windows app window standing in a brushed-metal tray, the Windows sibling of MacBox's icon. Drawn on a 256 grid for 96 px and up; the smaller sizes have drawings of their own. scripts/make-icon.ps1 renders AppIcon.ico from these files. -->
  <defs>
    <!-- Platinum front wall: bright under the lip, cooler toward the floor, a little light bouncing back at the bottom -->
    <linearGradient id="face" x1="0" y1="118" x2="0" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFCFD"/>
      <stop offset="0.2" stop-color="#E6EAF0"/>
      <stop offset="0.65" stop-color="#C6CED8"/>
      <stop offset="0.92" stop-color="#A9B3C0"/>
      <stop offset="1" stop-color="#B8C1CC"/>
    </linearGradient>
    <!-- One soft reflection on the upper face; the floor edge stays clean -->
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 150) scale(96 46)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ends" x1="20" y1="0" x2="236" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B374A" stop-opacity="0.36"/>
      <stop offset="0.07" stop-color="#2B374A" stop-opacity="0.05"/>
      <stop offset="0.93" stop-color="#2B374A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2B374A" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="bounce" x1="0" y1="206" x2="0" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="96" x2="0" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6DCE4"/>
    </linearGradient>
    <!-- Inside: in the rim's shadow at the top, lit lower down, the side walls turned away -->
    <linearGradient id="inside" x1="0" y1="101" x2="0" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A8698"/>
      <stop offset="0.22" stop-color="#A2ACBA"/>
      <stop offset="0.65" stop-color="#B9C2CE"/>
      <stop offset="1" stop-color="#A3ADBB"/>
    </linearGradient>
    <linearGradient id="insideEnds" x1="26" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26324A" stop-opacity="0.42"/>
      <stop offset="0.13" stop-color="#26324A" stop-opacity="0"/>
      <stop offset="0.87" stop-color="#26324A" stop-opacity="0"/>
      <stop offset="1" stop-color="#26324A" stop-opacity="0.42"/>
    </linearGradient>
    <!-- Window: sapphire title bar, a cool white page -->
    <linearGradient id="titlebar" x1="64" y1="46" x2="150" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A9BE8"/>
      <stop offset="0.55" stop-color="#4373D0"/>
      <stop offset="1" stop-color="#3159B4"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="76" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F7"/>
    </linearGradient>
    <linearGradient id="underLip" x1="0" y1="134" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2840" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C2840" stop-opacity="0.2"/>
    </linearGradient>

    <path id="outline" d="M46 96H210C226 96 236 104 236 116V200A28 28 0 0 1 208 228H48A28 28 0 0 1 20 200V116C20 104 30 96 46 96Z"/>
    <path id="inner" d="M26 172V118C26 108 34 101 48 101H208C222 101 230 108 230 118V172Z"/>
    <path id="front" d="M20 126A8 8 0 0 1 28 118H56C70 118 76 158 96 158H160C180 158 186 118 200 118H228A8 8 0 0 1 236 126V200A28 28 0 0 1 208 228H48A28 28 0 0 1 20 200Z"/>
    <path id="lip" d="M20 126A8 8 0 0 1 28 118H56C70 118 76 158 96 158H160C180 158 186 118 200 118H228A8 8 0 0 1 236 126"/>
    <clipPath id="outlineClip"><use href="#outline"/></clipPath>
    <clipPath id="innerClip"><use href="#inner"/></clipPath>
    <clipPath id="frontClip"><use href="#front"/></clipPath>
    <clipPath id="windowClip"><rect x="64" y="46" width="128" height="144" rx="10"/></clipPath>

    <filter id="castShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1B2740" flood-opacity="0.16"/>
    </filter>
    <filter id="ground" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <!-- Fine horizontal hairlines of brushed aluminium, kept faint -->
    <filter id="brushed" filterUnits="userSpaceOnUse" x="18" y="94" width="220" height="136">
      <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.9" numOctaves="1" seed="3"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1"/>
    </filter>
  </defs>

  <!-- Contact shadow -->
  <ellipse cx="128" cy="227" rx="100" ry="5.5" fill="#1B2333" opacity="0.3" filter="url(#ground)"/>

  <!-- The tray behind the window: rim, inside, and the outline (the window stands in front of all of it) -->
  <use href="#outline" fill="url(#rim)"/>
  <use href="#inner" fill="url(#inside)"/>
  <use href="#inner" fill="url(#insideEnds)"/>
  <g clip-path="url(#innerClip)">
    <!-- the window's shadow on the back wall -->
    <rect x="68" y="54" width="128" height="140" rx="10" fill="#1B2740" opacity="0.34" filter="url(#castShadow)"/>
  </g>
  <path d="M26 118C26 108 34 101 48 101H208C222 101 230 108 230 118" fill="none" stroke="#56637A" stroke-opacity="0.55" stroke-width="1.2"/>
  <use href="#outline" fill="none" stroke="#2F3947" stroke-opacity="0.5" stroke-width="2" clip-path="url(#outlineClip)"/>
  <path d="M46 97.5H210C224 97.5 234 104.5 234.5 116" fill="none" stroke="#FFFFFF" stroke-opacity="0.9"/>
  <path d="M46 97.5C32 97.5 22 104.5 21.5 116" fill="none" stroke="#FFFFFF" stroke-opacity="0.9"/>

  <!-- The window, standing in the tray -->
  <rect x="64" y="46" width="128" height="144" rx="10" fill="url(#page)" filter="url(#lift)"/>
  <g clip-path="url(#windowClip)">
    <rect x="64" y="46" width="128" height="30" fill="url(#titlebar)"/>
    <rect x="64" y="46" width="128" height="1.5" fill="#FFFFFF" opacity="0.32"/>
    <rect x="64" y="75" width="128" height="1" fill="#1E3F86" opacity="0.35"/>
    <!-- app icon and title, then minimize, maximize, close -->
    <rect x="76" y="55" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.92"/>
    <rect x="94" y="59" width="26" height="4" rx="2" fill="#FFFFFF" opacity="0.55"/>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="1.9" stroke-linecap="round">
      <path d="M128 61H137"/>
      <rect x="150" y="56.5" width="9" height="9" rx="1.6" stroke-width="1.8"/>
      <path d="M172 56.5L181 65.5M181 56.5L172 65.5"/>
    </g>
    <!-- content -->
    <rect x="78" y="88" width="78" height="7" rx="3.5" fill="#CED7E3"/>
    <g fill="#DFE5ED">
      <rect x="78" y="103" width="96" height="7" rx="3.5"/>
      <rect x="78" y="118" width="70" height="7" rx="3.5"/>
      <rect x="78" y="133" width="86" height="7" rx="3.5"/>
    </g>
    <rect x="64" y="46" width="128" height="144" fill="url(#underLip)"/>
  </g>
  <rect x="64.5" y="46.5" width="127" height="143" rx="9.5" fill="none" stroke="#1B2B48" stroke-opacity="0.16"/>

  <!-- Front wall -->
  <use href="#front" fill="url(#face)"/>
  <g clip-path="url(#frontClip)">
    <rect x="18" y="94" width="220" height="136" filter="url(#brushed)" opacity="0.09" style="mix-blend-mode:overlay"/>
    <rect x="18" y="94" width="220" height="136" fill="url(#sheen)"/>
    <rect x="18" y="94" width="220" height="136" fill="url(#ends)"/>
    <rect x="18" y="204" width="220" height="26" fill="url(#bounce)"/>
    <!-- the rolled lip: bright on top, a crease where it meets the face -->
    <use href="#lip" fill="none" stroke="#F4F6F9" stroke-width="12"/>
    <use href="#lip" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <use href="#lip" fill="none" stroke="#7C889A" stroke-opacity="0.5" stroke-width="1.2" transform="translate(0 6.5)"/>
    <use href="#lip" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1" transform="translate(0 7.8)"/>
    <!-- outline of the front wall's sides and floor edge only: its top is the lit lip -->
    <path d="M20 126V200A28 28 0 0 0 48 228H208A28 28 0 0 0 236 200V126" fill="none" stroke="#2F3947" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
