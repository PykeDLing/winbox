<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- WinBox icon for 20 px: whole-pixel edges. -->
  <defs>
    <linearGradient id="face" x1="0" y1="11" x2="0" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3F5F8"/>
      <stop offset="1" stop-color="#ABB4C1"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="1" x2="0" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A8BE0"/>
      <stop offset="1" stop-color="#3863C2"/>
    </linearGradient>
    <path id="tray" d="M3 8H17A2 2 0 0 1 19 10V16.5A2.5 2.5 0 0 1 16.5 19H3.5A2.5 2.5 0 0 1 1 16.5V10A2 2 0 0 1 3 8Z"/>
    <path id="front" d="M1 12A1 1 0 0 1 2 11H4.5C5.8 11 5.6 13 7 13H13C14.4 13 14.2 11 15.5 11H18A1 1 0 0 1 19 12V16.5A2.5 2.5 0 0 1 16.5 19H3.5A2.5 2.5 0 0 1 1 16.5Z"/>
    <clipPath id="trayClip"><use href="#tray"/></clipPath>
    <clipPath id="frontClip"><use href="#front"/></clipPath>
    <clipPath id="windowClip"><rect x="5" y="1" width="10" height="14" rx="1.5"/></clipPath>
  </defs>
  <!-- tray behind the window, outline included -->
  <use href="#tray" fill="#E8ECF1"/>
  <path d="M2 14V10.5A1.5 1.5 0 0 1 3.5 9H16.5A1.5 1.5 0 0 1 18 10.5V14Z" fill="#7D889A"/>
  <use href="#tray" fill="none" stroke="#2F3947" stroke-opacity="0.6" stroke-width="2" clip-path="url(#trayClip)"/>
  <!-- window -->
  <rect x="5" y="1" width="10" height="14" rx="1.5" fill="#FFFFFF"/>
  <g clip-path="url(#windowClip)">
    <rect x="5" y="1" width="10" height="3" fill="url(#titlebar)"/>
    <rect x="7" y="6" width="6" height="1" fill="#C9D2DF"/>
  </g>
  <rect x="5.5" y="1.5" width="9" height="13" rx="1" fill="none" stroke="#1B2B48" stroke-opacity="0.3"/>
  <!-- front wall: lit lip, outlined along the sides and floor only -->
  <use href="#front" fill="url(#face)"/>
  <g clip-path="url(#frontClip)">
    <path d="M1 12.5A1 1 0 0 1 2 11.5H4.5C5.8 11.5 5.6 13.5 7 13.5H13C14.4 13.5 14.2 11.5 15.5 11.5H18A1 1 0 0 1 19 12.5" fill="none" stroke="#FFFFFF"/>
    <path d="M1 12V16.5A2.5 2.5 0 0 0 3.5 19H16.5A2.5 2.5 0 0 0 19 16.5V12" fill="none" stroke="#2F3947" stroke-opacity="0.6" stroke-width="2"/>
  </g>
</svg>
