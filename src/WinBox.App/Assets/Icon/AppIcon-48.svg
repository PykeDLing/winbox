<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- WinBox icon for 48 to 80 px (and the box packages' logo): the master's shapes without the metal texture, caption buttons on whole pixels. -->
  <defs>
    <linearGradient id="face" x1="0" y1="23" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFCFD"/>
      <stop offset="0.2" stop-color="#E6EAF0"/>
      <stop offset="0.65" stop-color="#C6CED8"/>
      <stop offset="0.92" stop-color="#A9B3C0"/>
      <stop offset="1" stop-color="#B8C1CC"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(19 29) scale(18 9)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ends" x1="2" y1="0" x2="46" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B374A" stop-opacity="0.34"/>
      <stop offset="0.09" stop-color="#2B374A" stop-opacity="0.05"/>
      <stop offset="0.91" stop-color="#2B374A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2B374A" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="17" x2="0" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6DCE4"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="18.5" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A8698"/>
      <stop offset="0.25" stop-color="#A2ACBA"/>
      <stop offset="0.65" stop-color="#B9C2CE"/>
      <stop offset="1" stop-color="#A3ADBB"/>
    </linearGradient>
    <linearGradient id="insideEnds" x1="3.5" y1="0" x2="44.5" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26324A" stop-opacity="0.42"/>
      <stop offset="0.14" stop-color="#26324A" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#26324A" stop-opacity="0"/>
      <stop offset="1" stop-color="#26324A" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="12" y1="4" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A9BE8"/>
      <stop offset="0.55" stop-color="#4373D0"/>
      <stop offset="1" stop-color="#3159B4"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="10" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F7"/>
    </linearGradient>
    <path id="tray" d="M6 17H42A4 4 0 0 1 46 21V39A6 6 0 0 1 40 45H8A6 6 0 0 1 2 39V21A4 4 0 0 1 6 17Z"/>
    <path id="inner" d="M3.5 32V21.5A3 3 0 0 1 6.5 18.5H41.5A3 3 0 0 1 44.5 21.5V32Z"/>
    <path id="front" d="M2 25A2 2 0 0 1 4 23H10C13.4 23 12.8 29 16.5 29H31.5C35.2 29 34.6 23 38 23H44A2 2 0 0 1 46 25V39A6 6 0 0 1 40 45H8A6 6 0 0 1 2 39Z"/>
    <path id="lip" d="M2 25A2 2 0 0 1 4 23H10C13.4 23 12.8 29 16.5 29H31.5C35.2 29 34.6 23 38 23H44A2 2 0 0 1 46 25"/>
    <clipPath id="trayClip"><use href="#tray"/></clipPath>
    <clipPath id="innerClip"><use href="#inner"/></clipPath>
    <clipPath id="frontClip"><use href="#front"/></clipPath>
    <clipPath id="windowClip"><rect x="12" y="4" width="24" height="30" rx="2.5"/></clipPath>
    <filter id="castShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <!-- tray behind the window: rim, inside, the window's shadow on the back wall, outline -->
  <use href="#tray" fill="url(#rim)"/>
  <use href="#inner" fill="url(#inside)"/>
  <use href="#inner" fill="url(#insideEnds)"/>
  <rect x="12.8" y="5.5" width="24" height="30" rx="2.5" fill="#1B2740" opacity="0.3" filter="url(#castShadow)" clip-path="url(#innerClip)"/>
  <path d="M3.5 21.5A3 3 0 0 1 6.5 18.5H41.5A3 3 0 0 1 44.5 21.5" fill="none" stroke="#56637A" stroke-opacity="0.5" stroke-width="0.8"/>
  <use href="#tray" fill="none" stroke="#2F3947" stroke-opacity="0.5" stroke-width="2" clip-path="url(#trayClip)"/>
  <!-- window -->
  <rect x="12" y="4" width="24" height="30" rx="2.5" fill="url(#page)"/>
  <g clip-path="url(#windowClip)">
    <rect x="12" y="4" width="24" height="6" fill="url(#titlebar)"/>
    <rect x="12" y="9.6" width="24" height="0.4" fill="#1E3F86" opacity="0.4"/>
    <rect x="14" y="6" width="2" height="2" rx="0.4" fill="#FFFFFF" opacity="0.9"/>
    <!-- caption buttons on whole pixels: minimize, maximize, close -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1">
      <path d="M21 7.5H24"/>
      <rect x="25.5" y="5.5" width="3" height="3"/>
      <path d="M30.6 5.1L33.4 7.9M33.4 5.1L30.6 7.9" stroke-width="1.1"/>
    </g>
    <rect x="15" y="13" width="14" height="2" rx="1" fill="#CED7E3"/>
    <g fill="#DFE5ED">
      <rect x="15" y="17" width="17" height="2" rx="1"/>
      <rect x="15" y="21" width="12" height="2" rx="1"/>
      <rect x="15" y="25" width="15" height="2" rx="1"/>
    </g>
  </g>
  <rect x="12.5" y="4.5" width="23" height="29" rx="2" fill="none" stroke="#1B2B48" stroke-opacity="0.18"/>
  <!-- front wall: lit lip and crease, outlined along the sides and floor only -->
  <use href="#front" fill="url(#face)"/>
  <g clip-path="url(#frontClip)">
    <rect x="0" y="16" width="48" height="32" fill="url(#sheen)"/>
    <rect x="0" y="16" width="48" height="32" fill="url(#ends)"/>
    <use href="#lip" fill="none" stroke="#F4F6F9" stroke-width="4"/>
    <use href="#lip" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <use href="#lip" fill="none" stroke="#7C889A" stroke-opacity="0.5" stroke-width="0.9" transform="translate(0 2.4)"/>
    <rect x="0" y="42.6" width="48" height="1" fill="#FFFFFF" opacity="0.35"/>
    <path d="M2 25V39A6 6 0 0 0 8 45H40A6 6 0 0 0 46 39V25" fill="none" stroke="#2F3947" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
